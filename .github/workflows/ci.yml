# CI version of `npm run check`: `npm run lint` needs the Tampermonkey extension from a
# Windows Chrome profile, so CI runs the equivalent `npm run lint:ci` instead.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/lint-ci/package-lock.json

      - name: Install lint dependencies
        run: npm ci --prefix tools/lint-ci

      - name: Lint
        run: npm run lint:ci

      - name: Unit tests
        run: npm test
