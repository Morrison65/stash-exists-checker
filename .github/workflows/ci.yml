# CI version of `npm run check`: `npm run lint` needs the Tampermonkey extension from a
# Windows Chrome profile, so CI runs the equivalent `npm run lint:ci` instead.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/lint-ci/package-lock.json

      - name: Install lint dependencies
        run: npm ci --prefix tools/lint-ci

      - name: Lint
        run: npm run lint:ci

      - name: Unit tests
        run: npm test

      # Installs auto-update from master, so a changed userscript must carry a higher @version.
      - name: Version bump
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then BASE_REF=HEAD~1; fi
          npm run version-bump -- "$BASE_REF"
